<!-- ===== Ask a question: email enquiry form (answered by AskRic, RIC-274) ===== -->
<style>
  #maxfab{position:fixed;right:22px;bottom:22px;z-index:60;display:inline-flex;align-items:center;gap:10px;
    padding:13px 20px 13px 15px;border-radius:980px;border:1px solid var(--line2);cursor:pointer;
    background:linear-gradient(135deg,rgba(125,184,255,.16),rgba(179,157,255,.16));backdrop-filter:blur(14px);
    color:var(--ink);font:inherit;font-size:14.5px;font-weight:560;letter-spacing:.01em;
    box-shadow:0 10px 40px rgba(106,75,216,.35),0 4px 14px rgba(0,0,0,.4);transition:transform .15s}
  #maxfab:hover{transform:translateY(-2px)}
  #maxfab .orbmark{width:22px;height:22px}
  #maxpanel{position:fixed;right:22px;bottom:22px;z-index:61;width:min(390px,calc(100vw - 32px));
    height:min(610px,calc(100vh - 40px));display:none;flex-direction:column;overflow:hidden;
    background:var(--panel);border:1px solid var(--line2);border-radius:20px;
    box-shadow:0 40px 120px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04) inset}
  #maxpanel.open{display:flex}
  .mx-head{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel))}
  .mx-head .orbmark{width:30px;height:30px;flex:0 0 30px}
  .mx-head .who{flex:1;min-width:0}
  .mx-head .who b{display:block;font-size:14.5px;font-weight:640}
  .mx-head .who small{display:block;color:var(--faint);font-size:11.5px;letter-spacing:.02em}
  .mx-head .x{cursor:pointer;color:var(--muted);border:0;background:none;font-size:22px;line-height:1;padding:2px 6px}
  .mx-head .x:hover{color:var(--ink)}
  .mx-body{flex:1;overflow-y:auto;padding:16px 15px;display:flex;flex-direction:column;gap:11px}
  .mx-msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .mx-msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--ink)}
  .mx-msg.me{align-self:flex-end;background:linear-gradient(135deg,#2a3f66,#3a2f66);border:1px solid var(--line2);border-bottom-right-radius:5px;color:#eef2ff}
  .mx-msg.sys{align-self:center;background:none;color:var(--faint);font-size:12px;text-align:center;max-width:95%}
  .mx-typing{align-self:flex-start;color:var(--faint);font-size:13px;padding:4px 6px}
  .mx-foot{border-top:1px solid var(--line);padding:10px 12px 12px}
  .mx-note{color:var(--faint);font-size:11px;line-height:1.4;margin:0 2px 9px;text-align:center}
  .mx-inrow{display:flex;gap:8px;align-items:flex-end}
  .mx-in{flex:1;resize:none;max-height:120px;min-height:42px;padding:11px 13px;border-radius:12px;
    border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font:inherit;font-size:14px;line-height:1.4}
  .mx-in:focus{outline:none;border-color:var(--accent)}
  .mx-send{flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:0;cursor:pointer;
    background:var(--ink);color:#000;font-size:17px;display:inline-flex;align-items:center;justify-content:center}
  .mx-send:disabled{opacity:.45;cursor:default}
  @media(max-width:520px){#maxpanel{right:8px;bottom:8px;width:calc(100vw - 16px);height:calc(100vh - 20px)}}
  .mx-form{display:flex;flex-direction:column;gap:10px}
  .mx-lab{font-size:12.5px;color:var(--muted)}
  .mx-em{padding:11px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font:inherit;font-size:16px}
  .mx-em:focus{outline:none;border-color:var(--accent)}
  .mx-form .mx-in{min-height:110px;max-height:none;font-size:16px}
  .mx-err{color:#ff9b9b;font-size:12.5px;min-height:1em}
  .mx-go{padding:12px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--ink);color:#000;font:inherit;font-weight:600;font-size:15px}
  .mx-go:disabled{opacity:.5;cursor:default}
  .mx-ok{font-size:14.5px;line-height:1.55}
  .mx-ok code{font-size:15px;background:var(--bg2);padding:2px 6px;border-radius:6px}
  @media(max-width:520px){#maxpanel{height:auto;max-height:calc(100vh - 20px)}}
</style>

<button id="maxfab" aria-label="Ask a question"><span class="orbmark"></span>Ask a question</button>

<div id="maxpanel" role="dialog" aria-label="Ask a question">
  <div class="mx-head">
    <span class="orbmark"></span>
    <div class="who"><b>Ask a question</b><small>we'll answer by email</small></div>
    <button class="x" id="mxclose" aria-label="Close">×</button>
  </div>
  <div class="mx-body" id="mxbody">
    <form class="mx-form" id="mxform" novalidate>
      <label class="mx-lab" for="mxemail">Your email</label>
      <input class="mx-em" id="mxemail" type="email" autocomplete="email" inputmode="email" maxlength="200" required placeholder="you@example.com">
      <label class="mx-lab" for="mxin">Your question</label>
      <textarea class="mx-in" id="mxin" maxlength="2000" required placeholder="What would you like to know about Autonome?"></textarea>
      <p class="mx-note">We'll answer by email. We keep your question and email address so we can reply. Please don't share anything private.</p>
      <div class="mx-err" id="mxerr" role="alert"></div>
      <button class="mx-go" id="mxsend" type="submit">Send question</button>
    </form>
    <div class="mx-ok" id="mxok" hidden></div>
  </div>
</div>

<script>
(function(){
  var panel=document.getElementById('maxpanel'),fab=document.getElementById('maxfab'),
      form=document.getElementById('mxform'),em=document.getElementById('mxemail'),
      q=document.getElementById('mxin'),err=document.getElementById('mxerr'),
      send=document.getElementById('mxsend'),ok=document.getElementById('mxok'),
      closeb=document.getElementById('mxclose');
  var EMAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/, busy=false, key=null;
  function openPanel(){panel.classList.add('open');fab.style.display='none';em.focus();
    if(window.autonomeTrack)try{autonomeTrack('enquiry_opened');}catch(e){}}
  function closePanel(){panel.classList.remove('open');fab.style.display='inline-flex';}
  fab.onclick=openPanel;closeb.onclick=closePanel;
  window.Max={open:openPanel,close:closePanel};
  form.addEventListener('submit',function(e){
    e.preventDefault(); if(busy)return; err.textContent='';
    var email=em.value.trim(), question=q.value.trim();
    if(!EMAIL_RE.test(email)){err.textContent="That email address doesn't look right.";em.focus();return;}
    if(question.length<3){err.textContent='Please type your question.';q.focus();return;}
    busy=true;send.disabled=true;send.textContent='Sending…';
    if(!key){key=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random();}
    fetch('/api/enquiry',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,question:question,page_url:location.href,page_title:document.title,idempotency_key:key})})
    .then(function(r){return r.json().then(function(j){return{status:r.status,j:j};});})
    .then(function(res){
      if(res.status===200&&res.j&&res.j.ok&&res.j.reference){
        form.hidden=true; ok.hidden=false;
        ok.innerHTML='Thanks, your question has been received.<br><br>Your reference is <code></code>.<br><br>The answer will be emailed to <b></b>.';
        ok.querySelector('code').textContent=res.j.reference; ok.querySelector('b').textContent=email; key=null;
        if(window.autonomeTrack)try{autonomeTrack('enquiry_sent');}catch(e){}
      } else { err.textContent=(res.j&&res.j.error)||'Sorry, that did not go through. Please try again.'; }
    })
    .catch(function(){err.textContent='Network problem. Please try again.';})
    .finally(function(){busy=false;send.disabled=false;send.textContent='Send question';});
  });
})();
</script>
